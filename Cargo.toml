[package]
name = "media-bpm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
realfft = "3.5.1"
symphonia = { version = "0.6.1", features = ["all"] }

[dev-dependencies]
tempfile = "3.27.0"

# The FFT and decoders are unusably slow unoptimised, and the tests run them.
[profile.dev.package."*"]
opt-level = 3
